<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d1d">
<title>ONLY UNBROKEN · Turntable 3D V11</title>
<style>
:root{
  --bg:#070b17; --panel:#0d1430; --panel2:#111a3b; --line:#283463;
  --text:#f7f8ff; --muted:#9da9cb; --purple:#7457ff; --blue:#2e8cff;
  --pink:#e24ccf; --cyan:#51d8ff; --green:#74e6bc; --red:#ff7c88;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 0%,#17266a 0,transparent 25%),
    radial-gradient(circle at 90% 10%,#4b1854 0,transparent 20%),
    linear-gradient(180deg,#0a1025,#060913);
  color:var(--text); overflow:hidden;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100%;display:grid;grid-template-rows:72px 1fr}
header{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
  padding:0 18px;background:rgba(8,13,30,.9);border-bottom:1px solid #202b57;
  backdrop-filter:blur(18px);
}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--pink));display:grid;place-items:center;font-weight:950;box-shadow:0 12px 30px #7457ff40}
.brand b{font-size:14px}.brand small{display:block;font-size:9px;color:#8f9ac0;margin-top:2px;letter-spacing:.08em}
.topnav{justify-self:center;display:flex;gap:6px;padding:5px;background:#0e1533;border:1px solid #283463;border-radius:18px}
.topnav button{border:0;background:transparent;color:#b7c0dc;padding:9px 14px;border-radius:13px;font-size:12px}
.topnav button.active{color:white;background:linear-gradient(135deg,var(--purple),var(--blue));font-weight:800}
.headActions{display:flex;gap:8px}
.headActions button{border:1px solid #2c3768;background:#121a3c;color:white;border-radius:13px;padding:10px 13px;font-size:11px}
.headActions .primary{background:linear-gradient(135deg,var(--purple),var(--pink));border:0;font-weight:800}

.workspace{min-height:0;display:grid;grid-template-columns:78px minmax(0,1fr) 310px;gap:12px;padding:12px}
.rail{
  background:linear-gradient(180deg,#10183a,#0b1026);border:1px solid #25305d;border-radius:24px;
  padding:9px 7px;display:flex;flex-direction:column;gap:6px;box-shadow:0 20px 50px #0005
}
.tool{min-height:62px;border:1px solid transparent;background:transparent;color:#9aa6c9;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:9px}
.tool span:first-child{font-size:19px}
.tool.active{background:linear-gradient(135deg,#6d54ff,#384dff);color:white;box-shadow:0 10px 26px #514cff45}
.spacer{flex:1}

.stage{
  min-width:0;position:relative;border:1px solid #25305d;border-radius:28px;
  background:linear-gradient(180deg,#111a39,#0b1023);box-shadow:0 20px 55px #0005;overflow:hidden
}
.stagebar{position:absolute;z-index:20;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.stageRight{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.stagebar>*{pointer-events:auto}
.viewSwitcher,.faceSwitcher,.stageActions{display:flex;gap:5px;padding:5px;background:#f2f4f8e8;border:1px solid #dce1ee;border-radius:16px;box-shadow:0 8px 25px #0002}
.viewSwitcher button,.faceSwitcher button,.stageActions button{border:0;background:transparent;color:#566079;border-radius:11px;padding:8px 11px;font-size:11px}
.viewSwitcher button.active,.faceSwitcher button.active{background:#fff;color:#1a2136;font-weight:800;box-shadow:0 5px 14px #0001}
.artboard{
  position:absolute;inset:68px 18px 70px;border-radius:24px;background:
  radial-gradient(circle at 50% 42%,#fff 0,#f4f5f9 58%,#e9ebf2 100%);
  border:1px solid #d9deeb;overflow:hidden;box-shadow:inset 0 1px 0 #fff;
}
.gridbg{
  position:absolute;inset:0;display:none;pointer-events:none;
  background-image:linear-gradient(#7d85a515 1px,transparent 1px),linear-gradient(90deg,#7d85a515 1px,transparent 1px);
  background-size:30px 30px
}
.garmentWrap{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
  width:min(63%,560px);aspect-ratio:530/690;
  filter:drop-shadow(0 26px 18px #27304425)
}
#garmentCanvas{position:absolute;inset:0;width:100%;height:100%}
#designArea{position:absolute;inset:0;touch-action:none}
.designLayer{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) rotate(0deg);touch-action:none}
.designLayer img{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}
.designLayer.selected{outline:2px dashed #755cff;outline-offset:5px}
.handle{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #6d54ff;box-shadow:0 5px 14px #0003;display:none}
.designLayer.selected .handle{display:block}
.resize{right:-12px;bottom:-12px}.rotate{right:-12px;top:-12px}.delete{left:-12px;top:-12px;background:#ffeff1;border-color:#ff6474;color:#d42335;font-size:11px;display:none!important}
.designLayer.selected .delete{display:grid!important;place-items:center}
.dragLabel{display:none;position:absolute;left:50%;bottom:-27px;transform:translateX(-50%);font-size:9px;color:#fff;background:#171d36db;padding:4px 7px;border-radius:8px;white-space:nowrap}
.designLayer.selected .dragLabel{display:block}
.stageHint{position:absolute;left:18px;bottom:18px;z-index:20;color:#cad1e7;background:#0e1533e8;border:1px solid #283463;border-radius:14px;padding:10px 12px;font-size:10px}

.panel{
  background:linear-gradient(180deg,#0e1533,#090f24);border:1px solid #25305d;border-radius:24px;
  padding:16px;overflow:auto;box-shadow:0 20px 50px #0005
}
.panel h2{margin:0 0 4px;font-size:20px}.panel p{margin:0;color:var(--muted);font-size:10px;line-height:1.5}
.card{margin-top:14px;padding:13px;border:1px solid #27335f;border-radius:17px;background:linear-gradient(180deg,#121b3e,#0d1430)}
.cardTitle{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#8491ba;margin-bottom:10px}
label{font-size:10px;color:#cbd2e7;display:block;margin:9px 0 5px}
input[type=text],select{width:100%;background:#0c132d;color:white;border:1px solid #304071;border-radius:12px;padding:10px;outline:none}
input[type=color]{width:100%;height:42px;background:#0c132d;border:1px solid #304071;border-radius:12px;padding:3px}
input[type=range]{width:100%;accent-color:#7457ff}
input[type=file]{width:100%;font-size:10px;color:#9aa6c9}
input[type=file]::file-selector-button{border:1px solid #344577;background:#151f45;color:white;border-radius:11px;padding:9px;margin-right:6px}
.btn{border:1px solid #324274;background:#151f45;color:#eef2ff;border-radius:12px;padding:10px 11px;font-size:10px}
.btn.primary{border:0;background:linear-gradient(135deg,#7457ff,#df49c7);font-weight:800}.btn.wide{width:100%}
.row{display:flex;gap:7px}.row>*{flex:1}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid #46517b;padding:0}.swatch.active{outline:2px solid #a99aff;outline-offset:2px}
.uploadBox{border:1px dashed #536190;border-radius:15px;padding:18px 10px;text-align:center;color:#a5afd0;font-size:10px}
.templateGrid,.libraryGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.template,.libraryItem{height:86px;border:1px solid #2e3b6b;border-radius:14px;background:#111a39;color:#eef2ff;display:grid;place-items:center;text-align:center;padding:7px;font-size:10px;overflow:hidden}
.template strong{font-size:13px}.libraryItem img{max-width:100%;max-height:62px;object-fit:contain}
.layerItem{display:flex;align-items:center;gap:8px;border:1px solid #293665;background:#101837;border-radius:13px;padding:8px;margin-bottom:7px}
.layerThumb{width:38px;height:38px;border-radius:9px;background:#0a1026;display:grid;place-items:center;overflow:hidden}.layerThumb img{max-width:100%;max-height:100%}
.layerText{min-width:0;flex:1;font-size:10px}.layerText b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layerText span{color:#8491ba}
.statusDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#74e6bc;margin-right:5px}
.pencilPad{display:block;width:100%;aspect-ratio:4/3;border-radius:14px;background:#f7f7fb;touch-action:none;border:1px solid #cfd5e4}

@media(max-width:900px){
  header{grid-template-columns:auto 1fr auto}.brand small{display:none}.topnav{justify-self:end}.topnav button{padding:8px 10px}
  .workspace{grid-template-columns:68px minmax(0,1fr) 278px;gap:8px;padding:8px}
  .rail,.panel,.stage{border-radius:20px}
  .tool{min-height:54px}
}

/* RESTORE patch */
.rail .tool{justify-content:center}
.rail .tool span:first-child:last-child{font-size:13px;font-weight:700}
.tool span+span{display:none}
.stageActions{display:flex;gap:8px;flex-wrap:wrap}
.artboard.view3d{display:block!important;perspective:1800px;background:radial-gradient(circle at 50% 30%,#ffffff 0%,#edf1f7 58%,#dce2ee 100%)}
.artboard.view3d .garmentWrap{transform:translate(-50%,-50%) scale(1.035);filter:drop-shadow(0 28px 34px rgba(0,0,0,.18));}
.artboard.view3d .garmentWrap::after{content:"";position:absolute;left:18%;right:18%;bottom:-3%;height:8%;background:radial-gradient(ellipse at center, rgba(0,0,0,.20), rgba(0,0,0,0) 70%);filter:blur(10px);z-index:-1}
#artboard.view3d #designArea{pointer-events:auto}
#artboard.view3d #garmentCanvas{border-radius:18px}
.topnav button,.stagebar .viewSwitcher button,.stageActions button,.headActions button,.btn,.template,.swatch{transition:all .18s ease}


/* V10 local 3D: no external model or library needed */
.local3d{
  display:none;
  position:absolute;
  inset:68px 18px 70px;
  z-index:12;
  border-radius:24px;
  overflow:hidden;
  border:1px solid #d9deeb;
  background:radial-gradient(circle at 50% 42%,#ffffff 0,#f4f5f9 58%,#e6eaf2 100%);
  perspective:1500px;
  touch-action:none;
  user-select:none;
}
.local3dScene{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  perspective:1500px;
  touch-action:none;
}
.hoodieCube{
  position:relative;
  width:min(58vw,530px);
  aspect-ratio:530/690;
  transform-style:preserve-3d;
  transform:rotateX(-1.5deg);
  transition:filter .22s ease;
  filter:drop-shadow(0 28px 26px rgba(20,28,48,.18));
  touch-action:none;
}
.hoodieCube.dragging{filter:drop-shadow(0 32px 30px rgba(20,28,48,.22))}
.face3d{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  opacity:0;
  transform-origin:50% 52%;
  transition:opacity .28s ease, transform .28s ease, filter .28s ease;
  will-change:opacity,transform;
}
.hoodieCube.dragging .face3d{transition:none}
.front3d,.right3d,.back3d,.left3d{transform:none}
.local3dHelp{
  position:absolute;
  left:14px;
  right:14px;
  bottom:14px;
  z-index:4;
  width:max-content;
  max-width:calc(100% - 28px);
  margin:auto;
  padding:9px 12px;
  border-radius:12px;
  color:#eef2ff;
  background:#10172fe8;
  border:1px solid #283463;
  font-size:10px;
  text-align:center;
  pointer-events:none;
}
.artboard.view3d{display:none!important}


/* REAL 3D V12 */
.local3d,.local3dScene,.hoodieCube,.face3d,.local3dHelp{display:none!important}
.real3d{
  display:none;
  position:absolute;
  inset:68px 18px 70px;
  z-index:14;
  border-radius:24px;
  overflow:hidden;
  border:1px solid #d9deeb;
  background:
    radial-gradient(circle at 50% 34%,#ffffff 0,#f2f4f8 58%,#dfe4ed 100%);
  touch-action:none;
}
#real3dMount{
  position:absolute;
  inset:0;
}
#real3dMount canvas{
  width:100%!important;
  height:100%!important;
  display:block;
  touch-action:none;
}
.real3dLoading{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:#20263a;
  background:linear-gradient(180deg,rgba(246,248,252,.94),rgba(234,238,246,.94));
  font-size:12px;
  text-align:center;
}
.real3dLoading b{font-size:15px}
.real3dLoading span{color:#6e7897;font-size:10px}
.real3dBadge{
  position:absolute;
  top:14px;
  left:14px;
  z-index:4;
  padding:8px 10px;
  border-radius:12px;
  background:#10172fe8;
  border:1px solid #283463;
  color:#eef2ff;
  font-size:10px;
  font-weight:800;
  letter-spacing:.08em;
  pointer-events:none;
}
.real3dHelp{
  position:absolute;
  left:14px;
  right:14px;
  bottom:14px;
  z-index:4;
  width:max-content;
  max-width:calc(100% - 28px);
  margin:auto;
  padding:9px 12px;
  border-radius:12px;
  color:#eef2ff;
  background:#10172fe8;
  border:1px solid #283463;
  font-size:10px;
  text-align:center;
  pointer-events:none;
}

</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">OU</div><div><b>ONLY UNBROKEN</b><small>CUSTOMWEAR · REAL 3D V12</small></div></div>
  <nav class="topnav">
    <button class="active" data-tab="design">Diseño</button>
    <button data-tab="library">Biblioteca</button>
    <button data-tab="templates">Plantillas</button>
    <button data-tab="settings">Ajustes</button>
  </nav>
  <div class="headActions"><button id="saveBtn">Guardar</button><button class="primary" id="exportBtn">Exportar</button></div>
</header>

<div class="workspace">
  <aside class="rail">
    <button class="tool active" data-tool="product"><span>Producto</span></button>
    <button class="tool" data-tool="colors"><span>Colores</span></button>
    <button class="tool" data-tool="text"><span>Textos</span></button>
    <button class="tool" data-tool="images"><span>Imágenes</span></button>
    <button class="tool" data-tool="pencil"><span>Apple Pencil</span></button>
    <button class="tool" data-tool="layers"><span>Capas</span></button>
    <div class="spacer"></div>
    <button class="tool" id="undoBtn"><span>Deshacer</span></button>
  </aside>

  <main class="stage">
    <div class="stagebar">
      <div class="viewSwitcher"><button id="editViewBtn" class="active">Editor fácil</button><button id="view3dBtn">Modelo 3D</button></div>
      <div class="stageRight">
        <div class="faceSwitcher">
          <button class="active" data-face="front">Frente</button>
          <button data-face="back">Espalda</button>
          <button data-face="left">Izquierda</button>
          <button data-face="right">Derecha</button>
        </div>
        <div class="stageActions"><button id="resetBtn">Restablecer</button><button id="centerBtn">Centrar diseño</button></div>
      </div>
    </div>
    <div class="artboard" id="artboard">
      <div class="gridbg" id="gridbg"></div>
      <div class="garmentWrap" id="garmentWrap">
        <canvas id="garmentCanvas" width="530" height="690"></canvas>
        <div id="designArea"></div>
      </div>
    </div>
    
    
    <div class="real3d" id="real3d">
      <div id="real3dMount"></div>
      <div class="real3dLoading" id="real3dLoading">
        <b>Cargando modelo 3D real…</b>
        <span>La primera carga puede tardar unos segundos.</span>
      </div>
      <div class="real3dBadge">REAL 3D · V12</div>
      <div class="real3dHelp">Arrastra para girar · Pellizca para acercar · Misma página, modelo 3D real</div>
    </div>
    <div class="stageHint" id="stageHint"><span class="statusDot"></span>Arrastra el diseño con el dedo o Apple Pencil. Usa las bolitas para girar y agrandar.</div>
  </main>

  <aside class="panel" id="panel"></aside>
</div>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const panel=$('#panel'), designArea=$('#designArea'), garmentCanvas=$('#garmentCanvas'), garmentCtx=garmentCanvas.getContext('2d');
const real3d=$('#real3d');
const hoodieSources={front:'hoodie_front.png',back:'hoodie_back.png',left:'hoodie_left.png',right:'hoodie_right.png'};
const hoodieImages=Object.fromEntries(Object.entries(hoodieSources).map(([k,v])=>{const im=new Image();im.src=v;return [k,im]}));
let hoodieColor='#e1e2e6';
let activeTool='product', activeTab='design', layers=[], selectedId=null, seq=1, library=[];
let viewMode='edit', showGrid=false, backgroundMode='light', currentFace='front';
let yaw3d=0, dragging3d=false, dragStartX=0, dragStartYaw=0;
const faceAngles={front:0,right:-90,back:-180,left:-270};
const faceOrder=['front','right','back','left'];
const faceCanvas3D={front:$('#face3d-front'),back:$('#face3d-back'),left:$('#face3d-left'),right:$('#face3d-right')};
const layerImgCache=new Map();
const stateKey='only_unbroken_real3d_v12';

function hexToRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function faceName(face){return ({front:'Frente',back:'Espalda',left:'Lado izquierdo',right:'Lado derecho'})[face]||'Frente'}
function currentGarment(){return hoodieImages[currentFace]||hoodieImages.front}
function renderGarment(){
 const hoodieImg=currentGarment();
 if(!hoodieImg.complete||!hoodieImg.naturalWidth)return;
 garmentCtx.clearRect(0,0,530,690);
 garmentCtx.drawImage(hoodieImg,0,0,530,690);
 const img=garmentCtx.getImageData(0,0,530,690),d=img.data,[r,g,b]=hexToRgb(hoodieColor);
 for(let i=0;i<d.length;i+=4){
   if(d[i+3]===0)continue;
   const lum=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;
   const shade=Math.max(.3,Math.min(1.16,.2+lum*1.02));
   const detail=(lum-.62)*18;
   d[i]=Math.max(0,Math.min(255,r*shade+detail));
   d[i+1]=Math.max(0,Math.min(255,g*shade+detail));
   d[i+2]=Math.max(0,Math.min(255,b*shade+detail));
 }
 garmentCtx.putImageData(img,0,0);
}
Object.values(hoodieImages).forEach(im=>im.onload=()=>{if(currentGarment().complete) renderGarment();renderAll3D()});



function renderAll3D(){
 if(window.syncOUReal3D) window.syncOUReal3D();
}

window.getOU3DState=()=>({
  hoodieColor,
  currentFace,
  layers: layers.map(l=>({
    id:l.id,
    data:l.data,
    name:l.name,
    type:l.type,
    aspect:l.aspect,
    x:l.x,
    y:l.y,
    w:l.w,
    rot:l.rot,
    face:l.face||'front'
  }))
});

function notify(msg){$('#stageHint').innerHTML='<span class="statusDot"></span>'+msg}
function setTool(tool){
 activeTool=tool; activeTab='design';
 $$('.tool[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));
 $$('.topnav button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='design'));
 renderPanel();
}
$$('.tool[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));

$$('.topnav button').forEach(b=>b.onclick=()=>{
 activeTab=b.dataset.tab;
 $$('.topnav button').forEach(x=>x.classList.toggle('active',x===b));
 if(activeTab==='design') activeTool='product';
 renderPanel();
});

function renderPanel(){
 let h='';
 if(activeTab==='library'){
   h=`<h2>Biblioteca</h2><p>Tus diseños subidos aparecen aquí. Tócalos para agregarlos.</p>
   <div class="card"><div class="cardTitle">Tus archivos</div><div class="libraryGrid" id="libraryGrid">${libraryHTML()}</div></div>`;
 } else if(activeTab==='templates'){
   h=`<h2>Plantillas</h2><p>Textos rápidos para empezar y luego moverlos directamente sobre la prenda.</p>
   <div class="card"><div class="cardTitle">Streetwear</div><div class="templateGrid">
   ${['ONLY UNBROKEN','NEVER FOLD','KEEP GOING','RESILIENCE','NO LIMITS','STAY REAL'].map(t=>`<button class="template" data-template="${t}"><strong>${t}</strong></button>`).join('')}
   </div></div>`;
 } else if(activeTab==='settings'){
   h=`<h2>Ajustes</h2><p>Configura la mesa de trabajo.</p>
   <div class="card"><div class="cardTitle">Vista sincronizada</div>
   <div class="row"><button class="btn" id="toggleGrid">${showGrid?'Quitar':'Mostrar'} cuadrícula</button><button class="btn" id="toggleBg">Fondo ${backgroundMode==='light'?'oscuro':'claro'}</button></div>
   <button class="btn wide" style="margin-top:8px" id="clearAll">Eliminar todos los diseños</button></div>`;
 } else if(activeTool==='product'){
   h=`<h2>Sudadera oversize</h2><p>La misma sudadera se usa en Editor fácil y en Modelo 3D. No cambia la prenda ni se pierde tu diseño.</p>
   <div class="card"><div class="cardTitle">Producto</div>
   <div style="display:flex;gap:10px;align-items:center"><div style="width:62px;height:72px;background:#eef1f6;border-radius:12px;display:grid;place-items:center"><img src="hoodie_front.png" style="max-width:56px;max-height:68px"></div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"

}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const MODEL_URL='https://cdn.3dassets.dev/assets/27162/v1/model.glb';

let renderer, scene, camera, controls, modelRoot, stickerRoot;
let started=false, loaded=false;
let baseMaterials=[];
let renderLoop=0;

const mount=document.getElementById('real3dMount');
const loading=document.getElementById('real3dLoading');

function hexColor(h){
  try{return new THREE.Color(h)}catch(_){return new THREE.Color('#e1e2e6')}
}

function fitCameraToObject(obj){
  const box=new THREE.Box3().setFromObject(obj);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());

  obj.position.sub(center);

  const maxDim=Math.max(size.x,size.y,size.z);
  const fov=camera.fov*Math.PI/180;
  let dist=maxDim/(2*Math.tan(fov/2));
  dist*=1.75;
  camera.position.set(0,0,dist);
  camera.near=Math.max(.01,dist/100);
  camera.far=dist*100;
  camera.updateProjectionMatrix();
  controls.target.set(0,0,0);
  controls.update();
}

function chooseGarmentMeshes(root){
  const meshes=[];
  root.traverse(o=>{
    if(o.isMesh){
      const count=o.geometry?.attributes?.position?.count||0;
      meshes.push({mesh:o,count});
      o.castShadow=true;
      o.receiveShadow=true;
    }
  });
  meshes.sort((a,b)=>b.count-a.count);
  const total=meshes.reduce((s,x)=>s+x.count,0)||1;
  let acc=0, chosen=[];
  for(const item of meshes){
    chosen.push(item.mesh);
    acc+=item.count;
    if(acc/total>.86)break;
  }
  return chosen;
}

function applyColor(){
  if(!loaded)return;
  const state=window.getOU3DState?.();
  const c=hexColor(state?.hoodieColor||'#e1e2e6');
  for(const entry of baseMaterials){
    const m=entry.material;
    if(!m)continue;
    // Avoid obviously metallic / hanger-like materials where possible.
    const n=(m.name||'').toLowerCase();
    if(n.includes('hanger')||n.includes('metal')||n.includes('hook'))continue;
    if('color' in m){
      m.color.copy(c);
      m.needsUpdate=true;
    }
  }
}

function removeStickers(){
  if(!stickerRoot)return;
  while(stickerRoot.children.length){
    const o=stickerRoot.children.pop();
    o.geometry?.dispose?.();
    const mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(m=>{
      if(m?.map)m.map.dispose?.();
      m?.dispose?.();
    });
  }
}

function facePlaneTransform(face, layer, modelBox){
  const size=modelBox.getSize(new THREE.Vector3());
  const center=modelBox.getCenter(new THREE.Vector3());
  const nx=(layer.x-50)/50;
  const ny=(50-layer.y)/50;
  const designW=Math.max(.05,(layer.w/100)*size.x*.95);
  const designH=designW/Math.max(.15,layer.aspect||1);
  const zPad=Math.max(.003,size.z*.025);

  let pos=new THREE.Vector3();
  let rot=new THREE.Euler();
  let w=designW, h=designH;

  if(face==='front'){
    pos.set(nx*size.x*.36, ny*size.y*.42, size.z*.5+zPad);
    rot.set(0,0,(layer.rot||0)*Math.PI/180);
  }else if(face==='back'){
    pos.set(-nx*size.x*.36, ny*size.y*.42, -size.z*.5-zPad);
    rot.set(0,Math.PI,-(layer.rot||0)*Math.PI/180);
  }else if(face==='left'){
    pos.set(-size.x*.5-zPad, ny*size.y*.42, -nx*size.z*.42);
    rot.set(0,-Math.PI/2,(layer.rot||0)*Math.PI/180);
    w=Math.max(.035,(layer.w/100)*size.z*1.5);
    h=w/Math.max(.15,layer.aspect||1);
  }else{
    pos.set(size.x*.5+zPad, ny*size.y*.42, nx*size.z*.42);
    rot.set(0,Math.PI/2,(layer.rot||0)*Math.PI/180);
    w=Math.max(.035,(layer.w/100)*size.z*1.5);
    h=w/Math.max(.15,layer.aspect||1);
  }

  pos.sub(center);
  return {pos,rot,w,h};
}

async function rebuildStickers(){
  if(!loaded || !modelRoot || !stickerRoot)return;
  removeStickers();
  const state=window.getOU3DState?.();
  if(!state)return;

  const box=new THREE.Box3().setFromObject(modelRoot);

  for(const layer of (state.layers||[])){
    if(!layer.data)continue;
    const texture=await new THREE.TextureLoader().loadAsync(layer.data).catch(()=>null);
    if(!texture)continue;
    texture.colorSpace=THREE.SRGBColorSpace;
    texture.anisotropy=renderer.capabilities.getMaxAnisotropy();

    const {pos,rot,w,h}=facePlaneTransform(layer.face||'front',layer,box);
    const geo=new THREE.PlaneGeometry(w,h);
    const mat=new THREE.MeshBasicMaterial({
      map:texture,
      transparent:true,
      depthWrite:false,
      side:THREE.DoubleSide,
      polygonOffset:true,
      polygonOffsetFactor:-2
    });
    const mesh=new THREE.Mesh(geo,mat);
    mesh.position.copy(pos);
    mesh.rotation.copy(rot);
    mesh.renderOrder=10;
    stickerRoot.add(mesh);
  }
}

function syncAll(){
  applyColor();
  rebuildStickers();
}

function setFace(face){
  if(!loaded)return;
  const map={
    front:[0,0,1],
    back:[0,0,-1],
    left:[-1,0,0],
    right:[1,0,0]
  };
  const d=map[face]||map.front;
  const box=new THREE.Box3().setFromObject(modelRoot);
  const size=box.getSize(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z);
  const dist=maxDim*1.75;
  camera.position.set(d[0]*dist, size.y*.03, d[2]*dist);
  controls.target.set(0,0,0);
  controls.update();
}

function init(){
  if(started)return;
  started=true;

  scene=new THREE.Scene();
  scene.background=new THREE.Color('#eef1f6');

  camera=new THREE.PerspectiveCamera(32,1,.01,100);
  camera.position.set(0,0,2.2);

  renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  mount.appendChild(renderer.domElement);

  controls=new OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;
  controls.dampingFactor=.08;
  controls.enablePan=false;
  controls.minDistance=.7;
  controls.maxDistance=4.5;
  controls.minPolarAngle=Math.PI*.28;
  controls.maxPolarAngle=Math.PI*.72;

  const hemi=new THREE.HemisphereLight(0xffffff,0x53617b,2.2);
  scene.add(hemi);

  const key=new THREE.DirectionalLight(0xffffff,3.0);
  key.position.set(2.2,3.2,4.2);
  key.castShadow=true;
  scene.add(key);

  const fill=new THREE.DirectionalLight(0xaabfff,1.3);
  fill.position.set(-3,1.5,2);
  scene.add(fill);

  const rim=new THREE.DirectionalLight(0xffffff,1.4);
  rim.position.set(0,2,-3);
  scene.add(rim);

  const ground=new THREE.Mesh(
    new THREE.CircleGeometry(1.1,64),
    new THREE.MeshBasicMaterial({color:0xdfe4ed,transparent:true,opacity:.45})
  );
  ground.rotation.x=-Math.PI/2;
  ground.position.y=-.52;
  scene.add(ground);

  const loader=new GLTFLoader();
  loader.load(MODEL_URL,gltf=>{
    modelRoot=gltf.scene;
    scene.add(modelRoot);

    const chosen=chooseGarmentMeshes(modelRoot);
    baseMaterials=[];
    for(const mesh of chosen){
      const mats=Array.isArray(mesh.material)?mesh.material:[mesh.material];
      for(const m of mats){
        if(m && !baseMaterials.some(x=>x.material===m)){
          baseMaterials.push({mesh,material:m});
          if('roughness' in m)m.roughness=Math.max(.72,m.roughness??.72);
          if('metalness' in m)m.metalness=0;
        }
      }
    }

    stickerRoot=new THREE.Group();
    modelRoot.add(stickerRoot);

    // Give the hoodie a slightly wider, more oversized silhouette.
    modelRoot.scale.set(1.12,1.0,1.08);

    fitCameraToObject(modelRoot);
    loaded=true;
    loading.style.display='none';
    syncAll();

    const state=window.getOU3DState?.();
    setFace(state?.currentFace||'front');
  },undefined,err=>{
    console.error(err);
    loading.innerHTML='<b>No se pudo cargar el GLB</b><span>Recarga la página. El Editor fácil sigue disponible.</span>';
  });

  const resize=()=>{
    const r=mount.getBoundingClientRect();
    if(!r.width||!r.height)return;
    renderer.setSize(r.width,r.height,false);
    camera.aspect=r.width/r.height;
    camera.updateProjectionMatrix();
  };
  new ResizeObserver(resize).observe(mount);
  resize();

  const loop=()=>{
    controls?.update();
    renderer.render(scene,camera);
    renderLoop=requestAnimationFrame(loop);
  };
  loop();
}

window.ensureOUReal3D=init;
window.syncOUReal3D=syncAll;
window.setOU3DFace=setFace;
</script>

</body>
</html>
