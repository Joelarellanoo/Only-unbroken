<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d1d">
<title>ONLY UNBROKEN · Editor HQ V13</title>
<style>
:root{
  --bg:#070b17; --panel:#0d1430; --panel2:#111a3b; --line:#283463;
  --text:#f7f8ff; --muted:#9da9cb; --purple:#7457ff; --blue:#2e8cff;
  --pink:#e24ccf; --cyan:#51d8ff; --green:#74e6bc; --red:#ff7c88;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 0%,#17266a 0,transparent 25%),
    radial-gradient(circle at 90% 10%,#4b1854 0,transparent 20%),
    linear-gradient(180deg,#0a1025,#060913);
  color:var(--text); overflow:hidden;
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100%;display:grid;grid-template-rows:72px 1fr}
header{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;
  padding:0 18px;background:rgba(8,13,30,.9);border-bottom:1px solid #202b57;
  backdrop-filter:blur(18px);
}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--pink));display:grid;place-items:center;font-weight:950;box-shadow:0 12px 30px #7457ff40}
.brand b{font-size:14px}.brand small{display:block;font-size:9px;color:#8f9ac0;margin-top:2px;letter-spacing:.08em}
.topnav{justify-self:center;display:flex;gap:6px;padding:5px;background:#0e1533;border:1px solid #283463;border-radius:18px}
.topnav button{border:0;background:transparent;color:#b7c0dc;padding:9px 14px;border-radius:13px;font-size:12px}
.topnav button.active{color:white;background:linear-gradient(135deg,var(--purple),var(--blue));font-weight:800}
.headActions{display:flex;gap:8px}
.headActions button{border:1px solid #2c3768;background:#121a3c;color:white;border-radius:13px;padding:10px 13px;font-size:11px}
.headActions .primary{background:linear-gradient(135deg,var(--purple),var(--pink));border:0;font-weight:800}

.workspace{min-height:0;display:grid;grid-template-columns:78px minmax(0,1fr) 310px;gap:12px;padding:12px}
.rail{
  background:linear-gradient(180deg,#10183a,#0b1026);border:1px solid #25305d;border-radius:24px;
  padding:9px 7px;display:flex;flex-direction:column;gap:6px;box-shadow:0 20px 50px #0005
}
.tool{min-height:62px;border:1px solid transparent;background:transparent;color:#9aa6c9;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:9px}
.tool span:first-child{font-size:19px}
.tool.active{background:linear-gradient(135deg,#6d54ff,#384dff);color:white;box-shadow:0 10px 26px #514cff45}
.spacer{flex:1}

.stage{
  min-width:0;position:relative;border:1px solid #25305d;border-radius:28px;
  background:linear-gradient(180deg,#111a39,#0b1023);box-shadow:0 20px 55px #0005;overflow:hidden
}
.stagebar{position:absolute;z-index:20;left:16px;right:16px;top:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.stageRight{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.stagebar>*{pointer-events:auto}
.viewSwitcher,.faceSwitcher,.stageActions{display:flex;gap:5px;padding:5px;background:#f2f4f8e8;border:1px solid #dce1ee;border-radius:16px;box-shadow:0 8px 25px #0002}
.viewSwitcher button,.faceSwitcher button,.stageActions button{border:0;background:transparent;color:#566079;border-radius:11px;padding:8px 11px;font-size:11px}
.viewSwitcher button.active,.faceSwitcher button.active{background:#fff;color:#1a2136;font-weight:800;box-shadow:0 5px 14px #0001}
.artboard{
  position:absolute;
  touch-action:none;inset:68px 18px 70px;border-radius:24px;background:
  radial-gradient(circle at 50% 42%,#fff 0,#f4f5f9 58%,#e9ebf2 100%);
  border:1px solid #d9deeb;overflow:hidden;box-shadow:inset 0 1px 0 #fff;
}
.gridbg{
  position:absolute;inset:0;display:none;pointer-events:none;
  background-image:linear-gradient(#7d85a515 1px,transparent 1px),linear-gradient(90deg,#7d85a515 1px,transparent 1px);
  background-size:30px 30px
}
.garmentWrap{
  position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) scale(var(--editorZoom,1));
  transform-origin:50% 50%;transition:transform .12s ease;
  width:min(63%,560px);aspect-ratio:530/690;
  filter:drop-shadow(0 26px 18px #27304425)
}
#garmentCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto}
#designArea{position:absolute;inset:0;touch-action:none}
.designLayer{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) rotate(0deg);touch-action:none}
.designLayer img{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none;image-rendering:auto;backface-visibility:hidden}
.designLayer.selected{outline:2px dashed #755cff;outline-offset:5px}
.handle{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #6d54ff;box-shadow:0 5px 14px #0003;display:none}
.designLayer.selected .handle{display:block}
.resize{right:-12px;bottom:-12px}.rotate{right:-12px;top:-12px}.delete{left:-12px;top:-12px;background:#ffeff1;border-color:#ff6474;color:#d42335;font-size:11px;display:none!important}
.designLayer.selected .delete{display:grid!important;place-items:center}
.dragLabel{display:none;position:absolute;left:50%;bottom:-27px;transform:translateX(-50%);font-size:9px;color:#fff;background:#171d36db;padding:4px 7px;border-radius:8px;white-space:nowrap}
.designLayer.selected .dragLabel{display:block}
.stageHint{position:absolute;left:18px;bottom:18px;z-index:20;color:#cad1e7;background:#0e1533e8;border:1px solid #283463;border-radius:14px;padding:10px 12px;font-size:10px}

.panel{
  background:linear-gradient(180deg,#0e1533,#090f24);border:1px solid #25305d;border-radius:24px;
  padding:16px;overflow:auto;box-shadow:0 20px 50px #0005
}
.panel h2{margin:0 0 4px;font-size:20px}.panel p{margin:0;color:var(--muted);font-size:10px;line-height:1.5}
.card{margin-top:14px;padding:13px;border:1px solid #27335f;border-radius:17px;background:linear-gradient(180deg,#121b3e,#0d1430)}
.cardTitle{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:#8491ba;margin-bottom:10px}
label{font-size:10px;color:#cbd2e7;display:block;margin:9px 0 5px}
input[type=text],select{width:100%;background:#0c132d;color:white;border:1px solid #304071;border-radius:12px;padding:10px;outline:none}
input[type=color]{width:100%;height:42px;background:#0c132d;border:1px solid #304071;border-radius:12px;padding:3px}
input[type=range]{width:100%;accent-color:#7457ff}
input[type=file]{width:100%;font-size:10px;color:#9aa6c9}
input[type=file]::file-selector-button{border:1px solid #344577;background:#151f45;color:white;border-radius:11px;padding:9px;margin-right:6px}
.btn{border:1px solid #324274;background:#151f45;color:#eef2ff;border-radius:12px;padding:10px 11px;font-size:10px}
.btn.primary{border:0;background:linear-gradient(135deg,#7457ff,#df49c7);font-weight:800}.btn.wide{width:100%}
.row{display:flex;gap:7px}.row>*{flex:1}
.swatches{display:flex;gap:7px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid #46517b;padding:0}.swatch.active{outline:2px solid #a99aff;outline-offset:2px}
.uploadBox{border:1px dashed #536190;border-radius:15px;padding:18px 10px;text-align:center;color:#a5afd0;font-size:10px}
.templateGrid,.libraryGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.template,.libraryItem{height:86px;border:1px solid #2e3b6b;border-radius:14px;background:#111a39;color:#eef2ff;display:grid;place-items:center;text-align:center;padding:7px;font-size:10px;overflow:hidden}
.template strong{font-size:13px}.libraryItem img{max-width:100%;max-height:62px;object-fit:contain}
.layerItem{display:flex;align-items:center;gap:8px;border:1px solid #293665;background:#101837;border-radius:13px;padding:8px;margin-bottom:7px}
.layerThumb{width:38px;height:38px;border-radius:9px;background:#0a1026;display:grid;place-items:center;overflow:hidden}.layerThumb img{max-width:100%;max-height:100%}
.layerText{min-width:0;flex:1;font-size:10px}.layerText b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layerText span{color:#8491ba}
.statusDot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#74e6bc;margin-right:5px}
.pencilPad{display:block;width:100%;aspect-ratio:4/3;border-radius:14px;background:#f7f7fb;touch-action:none;border:1px solid #cfd5e4}

@media(max-width:900px){
  header{grid-template-columns:auto 1fr auto}.brand small{display:none}.topnav{justify-self:end}.topnav button{padding:8px 10px}
  .workspace{grid-template-columns:68px minmax(0,1fr) 278px;gap:8px;padding:8px}
  .rail,.panel,.stage{border-radius:20px}
  .tool{min-height:54px}
}

/* RESTORE patch */
.rail .tool{justify-content:center}
.rail .tool span:first-child:last-child{font-size:13px;font-weight:700}
.tool span+span{display:none}
.stageActions{display:flex;gap:8px;flex-wrap:wrap}
.artboard.view3d{display:block!important;perspective:1800px;background:radial-gradient(circle at 50% 30%,#ffffff 0%,#edf1f7 58%,#dce2ee 100%)}
.artboard.view3d .garmentWrap{transform:translate(-50%,-50%) scale(1.035);filter:drop-shadow(0 28px 34px rgba(0,0,0,.18));}
.artboard.view3d .garmentWrap::after{content:"";position:absolute;left:18%;right:18%;bottom:-3%;height:8%;background:radial-gradient(ellipse at center, rgba(0,0,0,.20), rgba(0,0,0,0) 70%);filter:blur(10px);z-index:-1}
#artboard.view3d #designArea{pointer-events:auto}
#artboard.view3d #garmentCanvas{border-radius:18px}
.topnav button,.stagebar .viewSwitcher button,.stageActions button,.headActions button,.btn,.template,.swatch{transition:all .18s ease}


/* V10 local 3D: no external model or library needed */
.local3d{
  display:none;
  position:absolute;
  inset:68px 18px 70px;
  z-index:12;
  border-radius:24px;
  overflow:hidden;
  border:1px solid #d9deeb;
  background:radial-gradient(circle at 50% 42%,#ffffff 0,#f4f5f9 58%,#e6eaf2 100%);
  perspective:1500px;
  touch-action:none;
  user-select:none;
}
.local3dScene{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  perspective:1500px;
  touch-action:none;
}
.hoodieCube{
  position:relative;
  width:min(58vw,530px);
  aspect-ratio:530/690;
  transform-style:preserve-3d;
  transform:rotateX(-1.5deg);
  transition:filter .22s ease;
  filter:drop-shadow(0 28px 26px rgba(20,28,48,.18));
  touch-action:none;
}
.hoodieCube.dragging{filter:drop-shadow(0 32px 30px rgba(20,28,48,.22))}
.face3d{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  opacity:0;
  transform-origin:50% 52%;
  transition:opacity .28s ease, transform .28s ease, filter .28s ease;
  will-change:opacity,transform;
  image-rendering:auto;
}
.hoodieCube.dragging .face3d{transition:none}
.front3d,.right3d,.back3d,.left3d{transform:none}
.local3dHelp{
  position:absolute;
  left:14px;
  right:14px;
  bottom:14px;
  z-index:4;
  width:max-content;
  max-width:calc(100% - 28px);
  margin:auto;
  padding:9px 12px;
  border-radius:12px;
  color:#eef2ff;
  background:#10172fe8;
  border:1px solid #283463;
  font-size:10px;
  text-align:center;
  pointer-events:none;
}
.artboard.view3d{display:none!important}


.layerItem{cursor:pointer}
.layerItem.active{border-color:#7457ff;background:#17204a;box-shadow:inset 0 0 0 1px #7457ff55}
.faceMoveGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.faceMoveGrid .btn.active{border-color:#8c78ff;background:#231d55;color:#fff}
.zoomBtn{min-width:38px}
#zoomResetBtn{min-width:58px}
#doneEditBtn{display:none;background:linear-gradient(135deg,#7457ff,#df49c7);border:0;color:#fff;font-weight:800}

</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="logo">OU</div><div><b>ONLY UNBROKEN</b><small>CUSTOMWEAR · EDITOR HQ V13</small></div></div>
  <nav class="topnav">
    <button class="active" data-tab="design">Diseño</button>
    <button data-tab="library">Biblioteca</button>
    <button data-tab="templates">Plantillas</button>
    <button data-tab="settings">Ajustes</button>
  </nav>
  <div class="headActions"><button id="saveBtn">Guardar</button><button class="primary" id="exportBtn">Exportar</button></div>
</header>

<div class="workspace">
  <aside class="rail">
    <button class="tool active" data-tool="product"><span>Producto</span></button>
    <button class="tool" data-tool="colors"><span>Colores</span></button>
    <button class="tool" data-tool="text"><span>Textos</span></button>
    <button class="tool" data-tool="images"><span>Imágenes</span></button>
    <button class="tool" data-tool="pencil"><span>Apple Pencil</span></button>
    <button class="tool" data-tool="layers"><span>Capas</span></button>
    <div class="spacer"></div>
    <button class="tool" id="undoBtn"><span>Deshacer</span></button>
  </aside>

  <main class="stage">
    <div class="stagebar">
      <div class="viewSwitcher"><button id="editViewBtn" class="active">Editor fácil</button><button id="view3dBtn">Modelo 3D</button></div>
      <div class="stageRight">
        <div class="faceSwitcher">
          <button class="active" data-face="front">Frente</button>
          <button data-face="back">Espalda</button>
          <button data-face="left">Izquierda</button>
          <button data-face="right">Derecha</button>
        </div>
        <div class="stageActions">
          <button id="zoomOutBtn" class="zoomBtn" title="Alejar">−</button>
          <button id="zoomResetBtn" title="Restablecer zoom">100%</button>
          <button id="zoomInBtn" class="zoomBtn" title="Acercar">+</button>
          <button id="centerBtn">Centrar diseño</button>
          <button id="doneEditBtn">Listo</button>
          <button id="resetBtn">Restablecer</button>
        </div>
      </div>
    </div>
    <div class="artboard" id="artboard">
      <div class="gridbg" id="gridbg"></div>
      <div class="garmentWrap" id="garmentWrap">
        <canvas id="garmentCanvas" width="1060" height="1380"></canvas>
        <div id="designArea"></div>
      </div>
    </div>
    
    <div class="local3d" id="local3d">
      <div class="local3dScene" id="local3dScene">
        <div class="hoodieCube" id="hoodieCube">
          <canvas class="face3d front3d" id="face3d-front" width="1060" height="1380"></canvas>
          <canvas class="face3d back3d" id="face3d-back" width="1060" height="1380"></canvas>
          <canvas class="face3d left3d" id="face3d-left" width="1060" height="1380"></canvas>
          <canvas class="face3d right3d" id="face3d-right" width="1060" height="1380"></canvas>
        </div>
      </div>
      <div class="local3dHelp">Arrastra para girar. La prenda cambia suavemente entre frente, lados y espalda sin desaparecer.</div>
    </div>
    <div class="stageHint" id="stageHint"><span class="statusDot"></span>Arrastra el diseño. Pellizca o usa +/− para zoom. Vista 3D en alta calidad para evitar pixelado.</div>
  </main>

  <aside class="panel" id="panel"></aside>
</div>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const panel=$('#panel'), designArea=$('#designArea'), artboard=$('#artboard'), garmentWrap=$('#garmentWrap'), garmentCanvas=$('#garmentCanvas'), garmentCtx=garmentCanvas.getContext('2d');
const local3d=$('#local3d'), local3dScene=$('#local3dScene'), hoodieCube=$('#hoodieCube');
const hoodieSources={front:'hoodie_front.png',back:'hoodie_back.png',left:'hoodie_left.png',right:'hoodie_right.png'};
const hoodieImages=Object.fromEntries(Object.entries(hoodieSources).map(([k,v])=>{const im=new Image();im.src=v;return [k,im]}));
let hoodieColor='#e1e2e6';
let activeTool='product', activeTab='design', layers=[], selectedId=null, seq=1, library=[];
let viewMode='edit', showGrid=false, backgroundMode='light', currentFace='front', editorZoom=1;
let yaw3d=0, dragging3d=false, dragStartX=0, dragStartYaw=0;
const zoomPointers=new Map();
let pinchActive=false,pinchStartDistance=0,pinchStartZoom=1;
const faceAngles={front:0,right:-90,back:-180,left:-270};
const faceOrder=['front','right','back','left'];
const faceCanvas3D={front:$('#face3d-front'),back:$('#face3d-back'),left:$('#face3d-left'),right:$('#face3d-right')};
const layerImgCache=new Map();
const faceBaseCache=new Map();
const RENDER_W=1060, RENDER_H=1380;
const stateKey='only_unbroken_turntable_v11';

function hexToRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function faceName(face){return ({front:'Frente',back:'Espalda',left:'Lado izquierdo',right:'Lado derecho'})[face]||'Frente'}
function currentGarment(){return hoodieImages[currentFace]||hoodieImages.front}
function getTintedFace(face){
 const cached=faceBaseCache.get(face);
 if(cached && cached.color===hoodieColor)return cached.canvas;
 const img=hoodieImages[face];
 if(!img || !img.complete || !img.naturalWidth)return null;

 const c=document.createElement('canvas');
 c.width=RENDER_W;c.height=RENDER_H;
 const ctx=c.getContext('2d',{willReadFrequently:true});
 ctx.imageSmoothingEnabled=true;
 ctx.imageSmoothingQuality='high';
 ctx.clearRect(0,0,RENDER_W,RENDER_H);
 ctx.drawImage(img,0,0,RENDER_W,RENDER_H);

 const imageData=ctx.getImageData(0,0,RENDER_W,RENDER_H);
 const d=imageData.data,[r,g,b]=hexToRgb(hoodieColor);
 for(let i=0;i<d.length;i+=4){
   if(d[i+3]===0)continue;
   const lum=(d[i]*.2126+d[i+1]*.7152+d[i+2]*.0722)/255;
   const shade=Math.max(.3,Math.min(1.16,.2+lum*1.02));
   const detail=(lum-.62)*18;
   d[i]=Math.max(0,Math.min(255,r*shade+detail));
   d[i+1]=Math.max(0,Math.min(255,g*shade+detail));
   d[i+2]=Math.max(0,Math.min(255,b*shade+detail));
 }
 ctx.putImageData(imageData,0,0);
 faceBaseCache.set(face,{color:hoodieColor,canvas:c});
 return c;
}

function renderGarment(){
 const base=getTintedFace(currentFace);
 if(!base)return;
 garmentCtx.imageSmoothingEnabled=true;
 garmentCtx.imageSmoothingQuality='high';
 garmentCtx.clearRect(0,0,garmentCanvas.width,garmentCanvas.height);
 garmentCtx.drawImage(base,0,0,garmentCanvas.width,garmentCanvas.height);
}

Object.entries(hoodieImages).forEach(([face,im])=>im.onload=()=>{
 faceBaseCache.delete(face);
 if(face===currentFace)renderGarment();
 renderAll3D(face);
});

function tintGarmentToCanvas(face,targetCanvas){
 const base=getTintedFace(face);
 if(!base)return;
 const tx=targetCanvas.getContext('2d');
 const W=targetCanvas.width,H=targetCanvas.height;
 tx.imageSmoothingEnabled=true;
 tx.imageSmoothingQuality='high';
 tx.clearRect(0,0,W,H);
 tx.drawImage(base,0,0,W,H);

 const faceLayers=layers.filter(l=>(l.face||'front')===face);
 faceLayers.forEach(l=>{
   let im=layerImgCache.get(l.data);
   if(!im){
     im=new Image();
     im.decoding='async';
     im.onload=()=>renderAll3D(face);
     im.src=l.data;
     layerImgCache.set(l.data,im);
   }
   if(!im.complete || !im.naturalWidth)return;

   const w=l.w/100*W;
   const h=w/(l.aspect||1);
   const x=l.x/100*W;
   const y=l.y/100*H;

   tx.save();
   tx.imageSmoothingEnabled=true;
   tx.imageSmoothingQuality='high';
   tx.translate(x,y);
   tx.rotate((l.rot||0)*Math.PI/180);
   tx.drawImage(im,-w/2,-h/2,w,h);
   tx.restore();
 });
}

function renderAll3D(faceOnly=null){
 if(faceOnly && faceCanvas3D[faceOnly]){
   tintGarmentToCanvas(faceOnly,faceCanvas3D[faceOnly]);
   return;
 }
 Object.keys(faceCanvas3D).forEach(face=>tintGarmentToCanvas(face,faceCanvas3D[face]));
}

function normalizedTurn(v){
 // 0 = front, 90 = right, 180 = back, 270 = left
 return ((-v)%360+360)%360;
}

function easeTurn(t){
 return t*t*(3-2*t);
}

function apply3DRotation(animate=true){
 if(!hoodieCube)return;
 hoodieCube.classList.toggle('dragging',!animate);
 const turn=normalizedTurn(yaw3d);
 const segment=turn/90;
 const idx=Math.floor(segment)%4;
 const rawT=segment-Math.floor(segment);
 const t=easeTurn(rawT);
 const a=faceOrder[idx];
 const b=faceOrder[(idx+1)%4];

 // Keep a garment visible during the entire rotation. This replaces the old
 // cube edge-on behavior that made the hoodie disappear mid-drag.
 for(const face of faceOrder){
   const c=faceCanvas3D[face];
   if(!c)continue;
   if(face===a){
     const sx=1-(.18*t);
     const tx=-7*t;
     c.style.opacity=String(1-t);
     c.style.transform=`translateX(${tx}%) scaleX(${sx}) scaleY(${1-.015*t})`;
     c.style.filter=`brightness(${1-.04*t})`;
     c.style.zIndex='2';
   }else if(face===b){
     const sx=.82+(.18*t);
     const tx=7*(1-t);
     c.style.opacity=String(t);

function setupPencil(){

 c.onpointerdown=e=>{drawing=true;last=pos(e);c.setPointerCapture?.(e.pointerId);e.preventDefault()};
 c.onpointermove=e=>{if(!drawing)return;const p=pos(e),pressure=e.pointerType==='pen'&&e.pressure?e.pressure:.55;x.strokeStyle=$('#pencilColor').value;x.lineWidth=+$('#pencilSize').value*(.6+pressure*.8);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;e.preventDefault()};
 c.onpointerup=()=>drawing=false;c.onpointercancel=()=>drawing=false;
 $('#pencilClear').onclick=()=>x.clearRect(0,0,c.width,c.height);

}
function trimCanvas(c){
 const x=c.getContext('2d'),im=x.getImageData(0,0,c.width,c.height),d=im.data;let minX=c.width,minY=c.height,maxX=-1,maxY=-1;
 for(let y=0;y<c.height;y++)for(let xx=0;xx<c.width;xx++){if(d[(y*c.width+xx)*4+3]>5){minX=Math.min(minX,xx);maxX=Math.max(maxX,xx);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}}
 if(maxX<0){notify('Dibuja algo primero');return null}
 const p=18,w=maxX-minX+1+p*2,h=maxY-minY+1+p*2,o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').drawImage(c,minX-p,minY-p,w,h,0,0,w,h);return o.toDataURL('image/png')
}

function pointerDistance(){

 const gw=1020,gh=1020*garmentCanvas.height/garmentCanvas.width,gx=(1800-gw)/2,gy=(1800-gh)/2;
 x.drawImage(g,gx,gy,gw,gh);
 const jobs=visibleLayers().map(l=>new Promise(res=>{const im=new Image();im.onload=()=>{const w=l.w/100*gw,h=w/l.aspect,px=gx+l.x/100*gw,py=gy+l.y/100*gh;x.save();x.translate(px,py);x.rotate(l.rot*Math.PI/180);x.drawImage(im,-w/2,-h/2,w,h);x.restore();res()};im.src=l.data}));
 Promise.all(jobs).then(()=>{const a=document.createElement('a');a.download='only-unbroken-mockup.png';a.href=c.toDataURL('image/png');a.click();notify('PNG exportado')})
}
function saveState(){try{localStorage.setItem(stateKey,JSON.stringify({hoodieColor,currentFace,yaw3d,editorZoom,layers:layers.map(({id,data,name,type,aspect,x,y,w,rot,face})=>({id,data,name,type,aspect,x,y,w,rot,face})),library,showGrid,backgroundMode,seq}))}catch(e){}}
function loadState(){try{const d=JSON.parse(localStorage.getItem(stateKey)||'null');if(!d)return;hoodieColor=d.hoodieColor||hoodieColor;layers=(d.layers||[]).map(l=>({...l,face:l.face||'front'}));library=d.library||[];showGrid=!!d.showGrid;backgroundMode=d.backgroundMode||'light';currentFace=d.currentFace||'front';yaw3d=typeof d.yaw3d==='number'?d.yaw3d:(faceAngles[currentFace]??0);editorZoom=typeof d.editorZoom==='number'?d.editorZoom:1;seq=d.seq||100;$('#gridbg').style.display=showGrid?'block':'none';$$('[data-face]').forEach(b=>b.classList.toggle('active',b.dataset.face===currentFace))}catch(e){}}
loadState();setEditorZoom(editorZoom,false);renderGarment();renderLayers();renderAll3D();snap3DToFace(currentFace,false);apply3DRotation(false);renderPanel();
</script>
